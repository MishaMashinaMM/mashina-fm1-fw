# SPDX-License-Identifier: GPL-3.0-only
# Experimental v0.6 browser emulator. Upload-only: NEVER deploy Pages or installer.
name: Transpose emulator preview

on:
  push:
    branches: [transpose]
    paths:
      - 'firmware/src/**'
      - 'web/emu/**'
      - 'tests/**'
      - '.github/workflows/transpose-emulator-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transpose-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate firmware assets
        run: |
          pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - name: Build v0.6 transpose web preview
        env:
          FELUCCA_NO_SEQUENCER: '1'
          EMU_PREVIEW: '1'
          EMU_VERSION: 'v0.6-transpose'
        run: sh web/emu/build.sh
      - name: Verify WebAssembly boot and audio
        run: |
          node web/emu/live-drums-wasm-test.mjs build/emu/felucca.wasm
          node web/emu/emu_test.mjs build/emu/felucca.wasm
      - name: Bundle standalone browser preview
        run: |
          cat > build/emu/START-HERE.txt <<'EOF'
          Jiant Live Drums v0.6 - TRANSPOSE PREVIEW (experimental)
          Not a firmware installer: do NOT flash this package.

          Windows:
          1. Unzip the whole artifact to a local folder.
          2. Open PowerShell in that folder.
          3. Run: py -m http.server 8000
          4. Visit http://localhost:8000/ in Chrome or Edge.
          5. Click Start Audio on the emulator.
          6. Open GLO > MIXER. K4 changes selected track transpose (-24..+24).
             PRESETS adjusts the master DJ Filter. K1/K2/K3 retain RX/level/pan.
          7. Open 'MIDI test input' below the instrument to send Note On/Off
             on the track's RX channel. Test layered tracks and sustained notes.

          Keep the terminal open while using the emulator. Ctrl+C stops it.
          This branch-only build does not modify the released v0.5 site.
          EOF
          printf '%s\n' "$GITHUB_SHA" > build/emu/SOURCE_COMMIT
          (cd build/emu && sha256sum felucca.wasm > WASM-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: jiant-live-drums-v06-transpose-web-preview
          path: build/emu/
          if-no-files-found: error
          retention-days: 14
