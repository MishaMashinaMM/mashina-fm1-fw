# SPDX-License-Identifier: GPL-3.0-only
# Branch-only FM1 hardware-test installer; no Pages deployment, no merge to main.
name: UI v0.9 device-test installer
on:
  push:
    branches: [ui-changes]
    paths:
      - 'firmware/src/**'
      - 'firmware/hal/**'
      - 'firmware/loader/**'
      - 'tools/**'
      - 'tests/**'
      - 'web/index_pkg.html'
      - 'web/jiant-ui.css'
      - 'README.md'
      - 'docs/**'
      - 'web/manual/index.html'
      - 'web/editor.html'
      - 'web/make_site.py'
      - '.github/workflows/ui-changes-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-v09-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install host dependencies
        run: pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
      - name: Validate orange UI, SAVE colors, HOME navigation, graphic palette
        timeout-minutes: 6
        run: |
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
          mkdir -p build/host/ui-changes
          for T in UI_TEST_HOME_FROM_GLO_ONLY UI_TEST_ORANGE_VALUES_ONLY UI_TEST_SAVE_COLORS_ONLY; do
            cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -D$T=1 -Ibuild/gen -Ifirmware/src -o build/host/ui-changes/$T tests/ui_test.c -lm
            timeout 60s build/host/ui-changes/$T
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in sorted(Path('docs').glob('*.svg')):
              ET.parse(path)
          print('All documentation SVG diagrams parsed successfully.')
          PY
      - name: Cache pinned JieLi toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1.2.1
      - name: Prepare pinned JieLi SDK
        run: |
          retry() { for d in 0 5 15 30 60; do sleep "$d"; "$@" && return 0; done; return 1; }
          T="$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools"
          [ -e "$HOME/.jieli/toolchain/pi32v2/bin/clang" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            cd "$HOME/fw-AC79_AIoT_SDK"
            git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin /cpu/wl82/tools/cfg/eq_cfg_hw.bin
            retry git checkout d179b4484759423312073f5fbb232501aa491047
          fi
          test -s "$T/uboot.boot" && test -s "$T/cfg_tool.bin" && test -s "$T/cfg/eq_cfg_hw.bin"
      - name: Build installable v0.9 firmware and verify flash/RAM layout
        env:
          FELUCCA_NO_SEQUENCER: '1'
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          set -o pipefail
          python3 tools/build.py --release 0.9 2>&1 | tee firmware-build.log
          test -s build/felucca-0.9.fwsc
          test -s build/felucca.bin
      - name: Create standalone branch-specific web installer
        run: |
          VERSION="v0.9-ui-${GITHUB_SHA::7}-preview"
          OUT="build/ui-v09-device-test"
          python3 web/make_site.py build/felucca-0.9.fwsc "$VERSION" "$OUT"
          test -s "$OUT/webapp/installer/index.html"
          test -s "$OUT/firmware/felucca-$VERSION.fwsc"
          echo "$GITHUB_SHA" > "$OUT/firmware/SOURCE_COMMIT"
          (cd "$OUT/firmware" && sha256sum felucca-*.fwsc > SHA256SUMS)
          cp firmware-build.log "$OUT/firmware/BUILD-LOG.txt"
          mkdir -p "$OUT/docs"
          cp README.md "$OUT/README.md"
          cp docs/JLD_MANUAL_V0.9.md "$OUT/docs/"
          cp docs/*.svg "$OUT/docs/"
          cat > "$OUT/READ-ME-FIRST.txt" <<'EOF'
          JIANT LIVE DRUMS v0.9 / orange UI - DEVICE TEST CANDIDATE
          ==========================================================
          Real FM1 firmware, not a browser-only preview.
          Not yet flashed or tested on physical FM1 in this UI form.
          Same firmware version v0.9, identity FM-1_909; package filename
          includes the source commit to distinguish it from main.

          BEFORE FLASHING: back up all projects, presets and settings.
          Use Windows with Chrome or Edge and the supported USB connection.
          1. Extract the entire ZIP (do not open installer directly from ZIP).
          2. Open PowerShell in the extracted directory.
          3. Run: py -m http.server 8000
          4. Visit http://localhost:8000/webapp/installer/
          5. Follow the on-screen steps; do not disconnect during flashing.

          DEVICE TEST CHECKLIST:
          - Startup JIANT LIVE DRUMS orange title and v0.9.
          - GLO/MIXER -> HOME fixes stale overlay; other page buttons work.
          - Selected MIXER/ZONES/TUNING row is white with black letters.
          - Editable values and breadcrumbs orange; labels gray; gauges gray.
          - SAVE PROJECT/SECTIONS: occupied orange; empty gray.
          - SAVE LIBRARY/PROJECTS: occupied orange borders and selection white.
          - MENU, EDIT and REC macro values and page titles.
          - Verify audio/MIDI playback, presets, project recalls and saved data.

          This ZIP DOES NOT change the public installer or main branch.
          After testing, report pass/fail before the candidate is merged.
          EOF
      - name: Upload standalone v0.9 orange UI web installer
        uses: actions/upload-artifact@v4
        with:
          name: jiant-live-drums-v09-orange-ui-device-installer
          path: build/ui-v09-device-test/
          if-no-files-found: error
          retention-days: 14
      - name: Upload raw v0.9 firmware and build report
        uses: actions/upload-artifact@v4
        with:
          name: jiant-live-drums-v09-orange-ui-firmware
          path: |
            build/felucca-0.9.fwsc
            build/felucca.bin
            firmware-build.log
          if-no-files-found: error
          retention-days: 14
