# PHASE factory-bank flash test: isolated downloadable WebMIDI installer.
# It never deploys over the official MASHINA Pages site.
name: PHASE factory bank test installer
on:
  push:
    branches: [factory-presets-phase-10]
    paths:
      - 'firmware/**'
      - 'tests/**'
      - 'tools/**'
      - 'web/**'
      - '.github/workflows/phase-factory-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install generator requirements
        run: pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
      - name: Verify PHASE preset bank and live firmware regressions
        run: |
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
          bash tests/run_live_drum_tests.sh
      - name: Cache validated JieLi SDK files and toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1.2.1
      - name: Install JieLi compiler and pinned SDK
        run: |
          set -e
          retry() { for d in 0 5 15 30 60; do sleep "$d"; "$@" && return 0; done; return 1; }
          T="$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools"
          [ -e "$HOME/.jieli/toolchain" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            (cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout d179b4484759423312073f5fbb232501aa491047)
          fi
          test -s "$T/uboot.boot" && test -s "$T/cfg_tool.bin" && test -s "$T/cfg/eq_cfg_hw.bin"
      - name: Compile test firmware, check memory budget, and generate installer
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          set -e
          python3 tools/build.py --release 0.10-preview | tee build-size.log
          python3 - <<'PY'
          from pathlib import Path
          size = Path('build/felucca.bin').stat().st_size
          limit = 0x8EA90
          free = limit - size
          pct = size * 100 / limit
          report = (f'MASHINA ANIMAL-free branch application flash use\n'
                    f'Firmware app: {size:,} bytes ({size/1024:.1f} KiB)\n'
                    f'Application slot: {limit:,} bytes ({limit/1024:.1f} KiB)\n'
                    f'Free: {free:,} bytes ({free/1024:.1f} KiB)\n'
                    f'Used: {pct:.2f}%\n')
          Path('build-size.txt').write_text(report)
          print(report)
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('### Firmware application flash usage\n\n```\n' + report + '```\n')
          PY
          test -s build/felucca-0.10-preview.fwsc
          python3 web/make_site.py build/felucca-0.10-preview.fwsc 0.10-preview build/phase-installer
          python3 tools/check_phase_installer.py build/phase-installer
          printf '%s\n' "$GITHUB_SHA" > build/phase-installer/firmware/SOURCE_COMMIT
          (cd build/phase-installer/firmware && sha256sum felucca-0.10-preview.fwsc > SHA256SUMS)
          cp build-size.txt build-size.log build/phase-installer/
      - name: Upload self-contained WebMIDI installer (not official firmware)
        uses: actions/upload-artifact@v4
        with:
          name: MASHINA-PHASE-10-FM1-test-installer
          path: build/phase-installer/
          if-no-files-found: error
          retention-days: 14
