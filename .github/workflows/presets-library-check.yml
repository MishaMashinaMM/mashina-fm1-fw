name: Presets library experimental checks
on:
  push:
    branches: [presets-library, presets-library-reclaim]
  workflow_dispatch:
    inputs:
      confirm_one_fm1:
        description: "For dangerous one-unit package: type ERASE ONE FM1 exactly. Empty = regression checks ONLY."
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: presets-library-experimental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify independent FM1 recovery dump verifier (host-only)
        run: python3 -m unittest discover -s tests -p verify_fm1_recovery_dumps_test.py -v
      - name: Guard source-level flash partition geometry and installer boundaries
        run: python3 tools/presets_library_flash_map_check.py
      - name: Confirm read-only flash audit cannot enable hardware writes
        run: |
          node tests/flash_readiness_audit_test.mjs
          node tests/flash_fingerprint_test.mjs
          node tests/flash_fingerprint_analysis_test.mjs
          node tests/flash_clean_layout_preflight_test.mjs
      - name: Verify existing storage and report 32-slot capacity
        run: |
          python3 tools/presets_library_capacity.py
          python3 tools/presets_library_pack_experiment.py
      - name: Verify host-only atomic 32-slot flash storage (no device writes)
        run: |
          mkdir -p build/host
          cc -O2 -Wall -Wextra -o build/host/preset_library_storage_test tests/preset_library_storage_test.c
          build/host/preset_library_storage_test
          cc -O2 -Wall -Wextra -o build/host/preset_library_wire_test tests/preset_library_wire_test.c
          build/host/preset_library_wire_test
      - name: Test 53-sector clean install prototype in simulated NOR only
        run: |
          mkdir -p build/host
          cc -std=gnu11 -O2 -Wall -Wextra -o build/host/clean_layout_formatter_host_test tests/clean_layout_formatter_host_test.c
          build/host/clean_layout_formatter_host_test
          cc -std=gnu11 -O2 -Wall -Wextra -o build/host/clean_layout_cold_boot_host_test tests/clean_layout_cold_boot_host_test.c
          build/host/clean_layout_cold_boot_host_test
      - name: Verify non-destructive candidate flash diagnostic (host NOR only)
        run: |
          mkdir -p build/host
          cc -std=gnu11 -O2 -Wall -Wextra -o build/host/flash_diagnostic_test tests/flash_diagnostic_test.c
          build/host/flash_diagnostic_test
      - name: Verify clean-break reference-based project record
        run: |
          mkdir -p build/host
          cc -std=gnu11 -O2 -Wall -Wextra -o build/host/project_refs_test tests/project_refs_test.c
          build/host/project_refs_test
      - name: Verify atomic two-section project banks (host-only)
        run: |
          mkdir -p build/host
          cc -std=gnu11 -O2 -Wall -Wextra -o build/host/project_refs_store_test tests/project_refs_store_test.c
          build/host/project_refs_store_test
      - name: Verify all 107 source-derived factory presets catalog
        run: |
          node tools/export_factory_catalog.mjs --check
          node tests/factory_presets_catalog_test.mjs
          node tests/factory_catalog_selection_test.mjs
      - name: Test JSON, binary record and WebMIDI codec
        run: |
          node tests/presets_library_codec_test.mjs
          node tests/presets_library_sync_test.mjs
          node tests/projects_library_codec_test.mjs
          node tests/performance_backup_test.mjs
          node tests/full_device_backup_test.mjs
          node tests/legacy_user_extract_test.mjs
          node tests/legacy_user_bank_restore_test.mjs
          node tests/emu_library_flash_persistence_test.mjs
          node tests/glo_boot_page_test.mjs
      - name: Check existing web backup regressions
        run: node web/test_backup.mjs
      - name: Prepare generated firmware headers
        run: |
          python3 -m pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1 Markdown==3.9
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - name: Verify actual project-owned settings mapping and bounded payload
        run: |
          mkdir -p build/host
          cc -std=gnu11 -O2 -Wall -Wextra -Ibuild/gen -Ifirmware/src -o build/host/project_ref_settings_test tests/project_ref_settings_test.c -lm
          build/host/project_ref_settings_test
      - name: Generate 18 exact drum-kit factory sidecars (host-only)
        run: |
          mkdir -p build/host
          cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -DMASHINA_HOST_TEST=1 -Ibuild/gen -Ifirmware/src -o build/host/factory_drum_export tests/factory_drum_export.c -lm
          build/host/factory_drum_export > build/host/factory-drum-records.json
          node tests/factory_drum_records_test.mjs build/host/factory-drum-records.json
          node tests/factory_catalog_complete_test.mjs build/host/factory-drum-records.json
      - name: Compile reference-only project SAVE/RECALL host test
        run: |
          mkdir -p build/host
          cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -DMASHINA_HOST_TEST=1 -Ibuild/gen -Ifirmware/src -o build/host/project_refs_live_test tests/project_refs_live_test.c -lm
      - name: Run reference-only project SAVE/RECALL host test
        run: build/host/project_refs_live_test
      - name: Test full six-track firmware sound loading with simulated LIBRARY flash
        run: |
          mkdir -p build/host
          cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -DMASHINA_HOST_TEST=1 -Ibuild/gen -Ifirmware/src -o build/host/presets_library_sound_test tests/presets_library_sound_test.c -lm
          build/host/presets_library_sound_test
      - name: Live drum and firmware host regressions
        run: bash tests/run_live_drum_tests.sh
      - name: JieLi build toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1.2.1
      - name: JieLi toolchain and SDK
        run: |
          retry() { for d in 0 5 15 30 60; do sleep "$d"; "$@" && return 0; done; return 1; }
          T=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          [ -e "$HOME/.jieli/toolchain" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            (cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout d179b4484759423312073f5fbb232501aa491047)
          fi
      - name: Firmware compile and linker memory report (NOT a device release)
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          python3 tools/build.py --release 0.13
          mkdir -p build/host
          cp build/felucca-0.13.fwsc build/host/stable-source-for-ota-test.fwsc
      - name: Compile experimental 32-slot library loader with physical writes LOCKED
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          FELUCCA_LIB32: "1"
          FELUCCA_LIB32_WRITE: "0"
        run: python3 tools/build.py --release 0.13
      - name: Compile project-reference firmware (all physical writes LOCKED)
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          FELUCCA_LIB32: "1"
          FELUCCA_LIB32_WRITE: "0"
          FELUCCA_PROJECT_REFS: "1"
          FELUCCA_PROJECT_REFS_WRITE: "0"
        run: python3 tools/build.py --release 0.13
      - name: Compile opt-in library write path with MPR1 routing (build only; never deploy)
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          FELUCCA_LIB32: "1"
          FELUCCA_LIB32_WRITE: "1"
          FELUCCA_PROJECT_REFS: "1"
          FELUCCA_PROJECT_REFS_WRITE: "0"
        run: python3 tools/build.py --release 0.13


      - name: Compile experimental MPR1 + LIB32 write adapters (build only, NEVER publish)
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          FELUCCA_LIB32: "1"
          FELUCCA_LIB32_WRITE: "1"
          FELUCCA_PROJECT_REFS: "1"
          FELUCCA_PROJECT_REFS_WRITE: "1"
        run: |
          python3 tools/build.py --release 0.13
          cp build/felucca-0.13.fwsc build/host/write-capable-source-for-ota-test.fwsc

      - name: Compile optional first-install MPR1 formatter (build only, NEVER deploy)
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          FELUCCA_LIB32: "1"
          FELUCCA_LIB32_WRITE: "1"
          FELUCCA_PROJECT_REFS: "1"
          FELUCCA_PROJECT_REFS_WRITE: "1"
          FELUCCA_PROJECT_REFS_FORMAT: "1"
        run: |
          python3 tools/build.py --release 0.13
          python3 tools/check_app_flash_headroom.py

      - name: Compile optional combined clean-install layout (build ONLY; never deploy)
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          FELUCCA_LIB32: "1"
          FELUCCA_LIB32_WRITE: "1"
          FELUCCA_PROJECT_REFS: "1"
          FELUCCA_PROJECT_REFS_WRITE: "1"
          FELUCCA_PROJECT_REFS_FORMAT: "1"
          FELUCCA_CLEAN_INSTALL_LAYOUT: "1"
        run: |
          python3 tools/build.py --release 0.13
          python3 tools/check_app_flash_headroom.py
          test ! -e build/felucca-0.13.fwsc
          test ! -e build/release-0.13
          # This output is deliberately NOT packaged or uploaded. The only
          # device firmware artifact in this workflow is the later diag build.
      - name: Simulate upgrade of actual firmware packages and verify ALL data-flash sectors
        run: |
          cc -std=gnu11 -O2 -Wall -Wextra -o build/host/ldr_test tests/ldr_test.c
          build/host/ldr_test build/host/stable-source-for-ota-test.fwsc build/host/write-capable-source-for-ota-test.fwsc
      - name: Build persistent-data-WRITE-BLOCKED flash PROBE firmware (OTA staging still writable)
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          FELUCCA_FLASH_DIAG: "1"
          FELUCCA_LIB32: "1"
          FELUCCA_LIB32_WRITE: "0"
          FELUCCA_PROJECT_REFS: "0"
          FELUCCA_PROJECT_REFS_WRITE: "0"
          FELUCCA_PROJECT_REFS_FORMAT: "0"
        run: |
          python3 tools/build.py --release 0.13-diag
          python3 tools/check_app_flash_headroom.py
          OUT=build/read-only-diagnostic
          VERSION="v0.13-diag-${GITHUB_SHA::7}"
          python3 web/make_site.py build/felucca-0.13-diag.fwsc "$VERSION" "$OUT"
          test -s "$OUT/webapp/installer/index.html"
          test -s "$OUT/firmware/felucca-$VERSION.fwsc"
          python3 - "$OUT/webapp/installer/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          html = p.read_text(encoding="utf-8")
          needle = '  <p><button id="go" disabled data-t="install"></button></p>'
          assert needle in html, "Installer layout changed; refuse to package diagnostic"
          html = html.replace(needle,
              '<p style="border:2px solid #ff9900;padding:14px;font-weight:700">'
              'READ-ONLY FLASH PROBE / v0.13-diag. '
              'This install STILL REFLASHES the firmware. '
              'Back up your running v0.13 projects, presets and settings first. '
              'The diagnostic app HAL blocks USER/project/settings/autosave writes; OTA staging remains writable. '
              'Use only Inspect flash; do not save settings, projects or presets. Not a public release.'
              '</p>\\n' + needle)
          assert "READ-ONLY FLASH PROBE" in html
          p.write_text(html, encoding="utf-8")
          PY
          cp docs/diagnostic-flash-readonly.md "$OUT/README.md"
          cp build/felucca-0.13-diag.fwsc "$OUT/"
          (cd "$OUT" && sha256sum felucca-0.13-diag.fwsc > SHA256SUMS)
          printf '%s\\n' "$GITHUB_SHA" > "$OUT/SOURCE_COMMIT"
          mkdir -p "$OUT/web-library"
          cp web/presets-library-lab.html "$OUT/web-library/index.html"
          cp web/presets-library-codec.mjs web/presets-library-midi.mjs web/presets-library-sync.mjs "$OUT/web-library/"
          cp web/fm1backup.js web/legacy-user-extract.mjs web/projects-library-codec.mjs web/projects-library-view.mjs web/performance-backup.mjs web/full-device-backup.mjs "$OUT/web-library/"
          cp web/factory-presets-from-code.json web/factory-catalog-selection.mjs "$OUT/web-library/"
          cp build/host/factory-drum-records.json "$OUT/web-library/"
          cp web/emulator-library-inspector.mjs web/emulator-snapshot-editor.mjs "$OUT/web-library/"
          cp web/flash-readiness.mjs web/flash-fingerprint-analysis.mjs "$OUT/web-library/"
          mkdir -p "$OUT/web-library/emu"
          cp web/emu/worklet.js web/emu/emulator-flash-backup.mjs "$OUT/web-library/emu/"
          python3 tools/check_library_preview.py "$OUT/web-library"
      - uses: actions/upload-artifact@v4
        with:
          name: mashina-fm1-read-only-flash-diagnostic
          path: build/read-only-diagnostic/
          retention-days: 14

      - name: Package standalone 32-slot web-library prototype
        run: |
          mkdir -p build/presets-library-preview
          cp web/presets-library-lab.html build/presets-library-preview/index.html
          cp web/library-064-single-write.html build/presets-library-preview/library-064-single-write.html
          cp web/presets-library-codec.mjs web/presets-library-midi.mjs web/presets-library-sync.mjs build/presets-library-preview/
          cp web/factory-presets-from-code.json web/factory-catalog-selection.mjs build/presets-library-preview/
          cp build/host/factory-drum-records.json build/presets-library-preview/
          cp web/legacy-user-extract.mjs web/full-device-backup.mjs web/projects-library-codec.mjs web/projects-library-view.mjs web/performance-backup.mjs web/fm1backup.js build/presets-library-preview/
          cp web/fm1backup.js web/legacy-user-extract.mjs web/projects-library-codec.mjs web/projects-library-view.mjs web/performance-backup.mjs web/full-device-backup.mjs build/presets-library-preview/
      - name: Copy emulator inspection dependencies to standalone library
        run: |
          cp web/emulator-library-inspector.mjs web/emulator-snapshot-editor.mjs build/presets-library-preview/
          cp web/flash-readiness.mjs web/flash-fingerprint-analysis.mjs build/presets-library-preview/
          mkdir -p build/presets-library-preview/emu
          cp web/emu/worklet.js web/emu/emulator-flash-backup.mjs build/presets-library-preview/emu/
      - name: Check standalone Web Library JS syntax and bundled imports
        run: python3 tools/check_library_preview.py build/presets-library-preview
      - name: Check single-slot physical trial remains limited to LIBRARY 064
        run: node tests/library_single_write_gate_test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mashina-presets-library-32-preview
          path: build/presets-library-preview/
          retention-days: 14

      # Explicitly authorized update of the already initialized test FM1.
      - name: Build initialized-device-only v0.13 update
        if: github.ref == 'refs/heads/presets-library' && github.event_name == 'push' && github.event.head_commit.message == 'PREPARE ONE FM1 INITIALIZED UPDATE'
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          FELUCCA_LIB32: "1"
          FELUCCA_LIB32_WRITE: "1"
          FELUCCA_PROJECT_REFS: "1"
          FELUCCA_PROJECT_REFS_WRITE: "1"
          FELUCCA_PROJECT_REFS_FORMAT: "0"
          FELUCCA_CLEAN_INSTALL_LAYOUT: "0"
          FELUCCA_INITIALIZED_UPDATE: "1"
          FELUCCA_FLASH_DIAG: "0"
        run: |
          python3 tools/build.py --release 0.13-update
          python3 tools/check_app_flash_headroom.py
          test -s build/felucca-0.13-update.fwsc
          build/host/ldr_test build/host/write-capable-source-for-ota-test.fwsc build/felucca-0.13-update.fwsc
          OUT=build/mashina-initialized-update
          VERSION="v0.13-update-$(git rev-parse --short=7 HEAD)"
          python3 web/make_site.py build/felucca-0.13-update.fwsc "$VERSION" "$OUT"
          python3 - "$OUT/webapp/installer/index.html" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          html = p.read_text(encoding="utf-8")
          needle = '  <p><button id="go" disabled data-t="install"></button></p>'
          assert needle in html
          html = html.replace(needle,
              '<p style="border:2px solid #ff9900;padding:14px;font-weight:700">'
              'INITIALIZED FM1 ONLY / v0.13-update. This still reflashes firmware. '
              'Use only the previously initialized 32+32 test FM1 after a verified complete backup. '
              'Do not use on the second unit. No first-install or format step. '
              'Stop if any preset or project is missing after reboot.</p>\n' + needle)
          p.write_text(html, encoding="utf-8")
          PY
          cp build/felucca-0.13-update.fwsc "$OUT/"
          cp -a build/presets-library-preview "$OUT/web-library"
          python3 tools/check_library_preview.py "$OUT/web-library"
          (cd "$OUT" && sha256sum felucca-0.13-update.fwsc > SHA256SUMS)
          printf 'INITIALIZED ONE-FM1 UPDATE ONLY\nBranch: %s\nCommit: %s\nFORMAT DISABLED\nSecond device: UNTOUCHED\n' "$GITHUB_REF" "$GITHUB_SHA" > "$OUT/PROVENANCE.txt"
          test -s "$OUT/webapp/installer/index.html"
          test ! -e "$OUT/first-install"
      - name: Upload initialized-device-only update (not a public release)
        if: github.ref == 'refs/heads/presets-library' && github.event_name == 'push' && github.event.head_commit.message == 'PREPARE ONE FM1 INITIALIZED UPDATE'
        uses: actions/upload-artifact@v4
        with:
          name: mashina-ONE-FM1-initialized-update-32x32
          path: build/mashina-initialized-update/
          retention-days: 7

      # Only a human-initiated Run workflow with the exact typed phrase can
      # produce a package capable of formatting all 53 old data sectors.
      # Ordinary pushes, other branches and all other build variants still
      # create NO destructive .fwsc artifact whatsoever.
      - name: Build explicitly authorized ONE-FM1 clean-start firmware
        if: github.ref == 'refs/heads/presets-library' && ((github.event_name == 'workflow_dispatch' && inputs.confirm_one_fm1 == 'ERASE ONE FM1') || (github.event_name == 'push' && github.event.head_commit.message == 'AUTHORIZE ONE FM1 CLEAN TRIAL'))
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          MASHINA_ONE_FM1_CLEAN_TRIAL: ERASE-ONE-FM1-32X32
          MASHINA_TRIAL_PUSH_AUTH: ${{ github.event.head_commit.message }}
          FELUCCA_LIB32: "1"
          FELUCCA_LIB32_WRITE: "1"
          FELUCCA_PROJECT_REFS: "1"
          FELUCCA_PROJECT_REFS_WRITE: "1"
          FELUCCA_PROJECT_REFS_FORMAT: "1"
          FELUCCA_CLEAN_INSTALL_LAYOUT: "1"
          FELUCCA_FLASH_DIAG: "0"
        run: |
          python3 tools/build.py --release 0.13-cleantrial
          python3 tools/check_app_flash_headroom.py
          test -s build/felucca-0.13-cleantrial.fwsc
          TRIAL=build/mashina-one-fm1-clean-trial
          mkdir -p "$TRIAL"
          python3 web/make_site.py build/felucca-0.13-cleantrial.fwsc "v0.13-cleantrial-${GITHUB_SHA::7}" "$TRIAL"
          mkdir -p "$TRIAL/first-install/emu"
          cp web/clean-install-trial.html "$TRIAL/first-install/index.html"
          cp web/fm1backup.js web/presets-library-midi.mjs web/legacy-user-bank-restore.mjs \
             web/legacy-user-extract.mjs web/presets-library-sync.mjs \
             web/presets-library-codec.mjs web/projects-library-codec.mjs \
             web/emulator-library-inspector.mjs web/emulator-snapshot-editor.mjs \
             web/factory-catalog-selection.mjs "$TRIAL/first-install/"
          cp web/emu/worklet.js web/emu/emulator-flash-backup.mjs "$TRIAL/first-install/emu/"
          cp -a build/presets-library-preview "$TRIAL/web-library"
          python3 tools/check_library_preview.py "$TRIAL/web-library"
          cp docs/first-fm1-32x32-install-runbook.md "$TRIAL/README.md"
          cp build/felucca-0.13-cleantrial.fwsc "$TRIAL/"
          (cd "$TRIAL" && sha256sum felucca-0.13-cleantrial.fwsc > SHA256SUMS)
          printf 'ONE-FM1 DESTRUCTIVE TRIAL ONLY\\nBranch: %s\\nCommit: %s\\nSecond device: UNTOUCHED\\n' "$GITHUB_REF" "$GITHUB_SHA" > "$TRIAL/PROVENANCE.txt"
          test -s "$TRIAL/webapp/installer/index.html"
          test -s "$TRIAL/first-install/index.html"
      - name: Upload explicitly authorized ONE-FM1 clean-start trial (NOT A PUBLIC RELEASE)
        if: github.ref == 'refs/heads/presets-library' && ((github.event_name == 'workflow_dispatch' && inputs.confirm_one_fm1 == 'ERASE ONE FM1') || (github.event_name == 'push' && github.event.head_commit.message == 'AUTHORIZE ONE FM1 CLEAN TRIAL'))
        uses: actions/upload-artifact@v4
        with:
          name: mashina-ONE-FM1-clean-start-32x32-DESTRUCTIVE-TRIAL
          path: build/mashina-one-fm1-clean-trial/
          retention-days: 7

      - name: Stage non-flashable one-device trial review dossier
        run: |
          mkdir -p build/one-device-trial-review
          cp docs/one-device-clean-install-trial.md docs/clean-slate-first-install.md docs/diagnostic-flash-readonly.md \
             docs/fm1-physical-recovery-preflight.md docs/first-fm1-32x32-install-runbook.md build/one-device-trial-review/
          mkdir -p build/one-device-trial-review/tools
          cp tools/verify_fm1_recovery_dumps.py build/one-device-trial-review/tools/
          cp tests/verify_fm1_recovery_dumps_test.py build/one-device-trial-review/
          cp tests/clean_install_release_gate_test.mjs build/one-device-trial-review/
          mkdir -p build/one-device-trial-review/web
          cp web/clean-install-trial.html web/presets-library-midi.mjs web/fm1backup.js \
             web/legacy-user-bank-restore.mjs web/legacy-user-extract.mjs \
             web/presets-library-codec.mjs web/presets-library-sync.mjs \
             web/projects-library-codec.mjs web/emulator-library-inspector.mjs \
             web/emulator-snapshot-editor.mjs web/factory-catalog-selection.mjs \
             build/one-device-trial-review/web/
          mkdir -p build/one-device-trial-review/web/emu
          cp web/emu/worklet.js web/emu/emulator-flash-backup.mjs build/one-device-trial-review/web/emu/
          printf 'Branch: presets-library\\nCommit: %s\\nStatus: NON-FLASHABLE REVIEW ONLY\\nRequires separately approved physical test: YES\\n' "$GITHUB_SHA" > build/one-device-trial-review/PROVENANCE.txt
          # Fail closed if this ever accidentally contains firmware or an installer.
          if find build/one-device-trial-review -type f \( -name '*.fwsc' -o -name '*.bin' -o -name '*.ufw' -o -name 'installer*' \) | grep -q .; then
            echo 'Refusing review bundle containing flashable files'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mashina-one-device-clean-install-review-NOT-FLASHABLE
          path: build/one-device-trial-review/
          retention-days: 14
