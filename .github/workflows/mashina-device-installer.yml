# SPDX-License-Identifier: GPL-3.0-only
# MASHINA / ATMOS branch: physical FM1 device-test installer.
# This workflow does NOT publish Pages, merge, tag, or replace stable v0.9.
name: MASHINA v0.9 device-test installer
on:
  push:
    branches: [atmos]
    paths:
      - '.github/workflows/mashina-device-installer.yml'
      - 'firmware/**'
      - 'tools/**'
      - 'tests/**'
      - 'web/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mashina-device-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned host dependencies
        run: pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
      - name: Generate assets and run live firmware regression tests
        timeout-minutes: 10
        run: |
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
          bash tests/run_live_drum_tests.sh
      - name: Cache pinned JieLi toolchain and SDK files
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1.2.1
      - name: Prepare pinned JieLi SDK
        run: |
          retry() { for d in 0 5 15 30 60; do sleep "$d"; "$@" && return 0; done; return 1; }
          T="$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools"
          [ -e "$HOME/.jieli/toolchain/pi32v2/bin/clang" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            cd "$HOME/fw-AC79_AIoT_SDK"
            git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin /cpu/wl82/tools/cfg/eq_cfg_hw.bin
            retry git checkout d179b4484759423312073f5fbb232501aa491047
          fi
          test -s "$T/uboot.boot" && test -s "$T/cfg_tool.bin" && test -s "$T/cfg/eq_cfg_hw.bin"
      - name: Build real FM1 firmware; verify flash and RAM limits
        env:
          FELUCCA_NO_SEQUENCER: '1'
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          set -o pipefail
          python3 tools/build.py --release 0.9 2>&1 | tee firmware-build.log
          test -s build/felucca-0.9.fwsc
          test -s build/felucca.bin
      - name: Package standalone MASHINA preview web installer
        run: |
          VERSION="v0.9-mashina-${GITHUB_SHA::7}-preview"
          OUT="build/mashina-device-test"
          python3 web/make_site.py build/felucca-0.9.fwsc "$VERSION" "$OUT"
          test -s "$OUT/webapp/installer/index.html"
          test -s "$OUT/firmware/felucca-$VERSION.fwsc"
          python3 - "$OUT/webapp/installer/index.html" "$VERSION" <<'PY'
          from pathlib import Path
          import sys
          p, version = Path(sys.argv[1]), sys.argv[2]
          html = p.read_text(encoding="utf-8")
          # Branding is limited to this generated test installer; the public
          # v0.9 web source, translations and installer safety logic stay intact.
          html = html.replace("<title>JIANT LIVE DRUMS — Installer</title>",
                              "<title>MASHINA — FM1 Device-Test Installer</title>")
          html = html.replace('aria-label="JIANT LIVE DRUMS home">JIANT<span class="fm"> LIVE DRUMS</span>',
                              'aria-label="MASHINA source repository">MASHINA<span class="fm"> FM1 PERFORMANCE FW</span>')
          html = html.replace("JIANT LIVE DRUMS source</a>", "MASHINA source</a>")
          html = html.replace('id="release-stamp" style=', 'id="release-stamp" style=')
          html = html.replace("v0.9 · ORANGE UI · BUILD /*BUILD_TAG*/", "MASHINA · DEVICE TEST · " + version)
          # Prominent warning above the flash action prevents confusing a
          # still-unverified candidate with the previously tested stable v0.9.
          needle = '  <p><button id="go" disabled data-t="install"></button></p>'
          assert needle in html, "Installer button anchor changed; stop packaging"
          html = html.replace(needle,
              '  <p style="border:2px solid #ff9900;padding:10px;font-weight:600">'
              'MASHINA PREVIEW - NOT DEVICE-TESTED. Back up all projects, '
              'user presets and settings before flashing. This build is from '
              'the atmos development branch, not the stable public release.'
              '</p>\n' + needle)
          assert "MASHINA PREVIEW - NOT DEVICE-TESTED" in html
          p.write_text(html, encoding="utf-8")
          PY
          printf '%s\n' "$GITHUB_SHA" > "$OUT/firmware/SOURCE_COMMIT"
          (cd "$OUT/firmware" && sha256sum felucca-*.fwsc > SHA256SUMS)
          cp firmware-build.log "$OUT/firmware/BUILD-LOG.txt"
          cat > "$OUT/READ-ME-FIRST.txt" <<'EOF'
          MASHINA - FM1 PERFORMANCE FW / v0.9 DEVICE TEST
          =================================================
          Branch: atmos. Built from the source commit in firmware/SOURCE_COMMIT.
          This is REAL flashable firmware, NOT a browser emulator.
          It is experimental and has not yet been physically tested.
          The splash shows release v0.9 (no -atmos suffix), while the ZIP
          package name includes a source commit to distinguish this candidate.
          The stable public v0.9 installer and main branch are unchanged.

          BEFORE FLASHING:
          Back up project slots, user presets, and settings. Keep a recovery
          firmware and recovery method ready. Use a reliable USB connection.
          Do not assume this development build is compatible with every other
          custom firmware; follow the installer's existing compatibility checks.

          WINDOWS / CHROME OR EDGE:
          1. Extract the complete installer artifact ZIP.
          2. In the extracted directory open PowerShell.
          3. Run: py -m http.server 8000
          4. Open http://localhost:8000/webapp/installer/
          5. Use the installer; do not unplug the FM1 during flashing.

          FIRST PHYSICAL TESTS:
          - Boot: MASHINA orange heading, abstract cog, FM1 PERFORMANCE FW,
            original Jiant attribution, and v0.9 without the preview suffix.
          - HOME long-press: SCREEN/AUDIO/MIDI/USB/CONTROLS/SYSTEM.
            No CLICK, CLICK LEVEL, or COUNT-IN; BPM LOCK retained.
          - ABOUT: MASHINA identity and project QR, live MIDI focus, original
            credits farther down; scroll and return to menu.
          - NAME editor: no NOTICE/DICE/NAME strip; compact footer.
          - FX/GLO/EDIT/LFO long-press: no top MAP/KNOBS/STATE tabs; footer.
          - Play from external MIDI keyboards/controllers on channels 1..6.
            Check splits/layers, transpose/fine tune, sustain, note-off and PANIC.
          - Try ATMOS and existing engines/drums, macros and global EQ.
          - Check project/preset save and recall across reboot.
          - Compare CPU load with six active tracks; report glitches or crashes.

          DO NOT merge or replace the stable installer until physical tests pass.
          EOF
          test -s "$OUT/READ-ME-FIRST.txt"
      - name: Upload standalone MASHINA browser flasher
        uses: actions/upload-artifact@v4
        with:
          name: mashina-v09-atmos-device-test-web-installer
          path: build/mashina-device-test/
          if-no-files-found: error
          retention-days: 14
      - name: Upload raw firmware and full build log
        uses: actions/upload-artifact@v4
        with:
          name: mashina-v09-atmos-firmware-build
          path: |
            build/felucca-0.9.fwsc
            build/felucca.bin
            firmware-build.log
          if-no-files-found: error
          retention-days: 14
