# SPDX-License-Identifier: GPL-3.0-only
# Experimental grayscale UI browser emulator. Upload-only: NEVER deploy Pages or an installer.
name: UI orange-accent emulator preview
on:
  push:
    branches: [ui-changes]
    paths:
      - 'firmware/src/**'
      - 'tools/gen_ui_palettes.py'
      - 'tests/theme_test.c'
      - 'tests/ui_test.c'
      - 'web/emu/**'
      - '.github/workflows/ui-changes-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-changes-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate assets and validate contrast
        run: |
          pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
          python3 tools/gen_ui_palettes.py --report
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - name: Verify neutral palette, text rendering and contrast
        run: |
          mkdir -p build/host/ui-changes
          cc -O1 -w -Ibuild/gen -Ifirmware/src -o build/host/ui-changes/theme_test tests/theme_test.c -lm
          build/host/ui-changes/theme_test
      - name: Verify HOME return from GLO mixer
        run: |
          cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -DUI_TEST_HOME_FROM_GLO_ONLY=1 -Ibuild/gen -Ifirmware/src -o build/host/ui-changes/glo_nav_test tests/ui_test.c -lm
          timeout 60s build/host/ui-changes/glo_nav_test
      - name: Verify orange values and splash title
        run: |
          cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -DUI_TEST_ORANGE_VALUES_ONLY=1 -Ibuild/gen -Ifirmware/src -o build/host/ui-changes/orange_values_test tests/ui_test.c -lm
          timeout 60s build/host/ui-changes/orange_values_test
      - name: Verify SAVE occupied and empty slot colors
        run: |
          cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -DUI_TEST_SAVE_COLORS_ONLY=1 -Ibuild/gen -Ifirmware/src -o build/host/ui-changes/save_colors_test tests/ui_test.c -lm
          timeout 60s build/host/ui-changes/save_colors_test
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - name: Build v0.9 orange-accent emulator
        env:
          EMU_PREVIEW: '1'
          EMU_VERSION: 'v0.9-ui-changes'
        run: sh web/emu/build.sh
      - name: Verify WebAssembly boot and UI
        run: |
          node web/emu/live-drums-wasm-test.mjs build/emu/felucca.wasm
          node web/emu/emu_test.mjs build/emu/felucca.wasm
      - name: Bundle standalone browser preview
        run: |
          cat > build/emu/START-HERE.txt <<'EOF'
          Jiant Live Drums v0.9 - GREYSCALE UI PREVIEW
          Browser emulator only; DO NOT flash this package.

          1. Unzip the GitHub Actions artifact to a local folder.
          2. Open a terminal in that folder and run: python -m http.server 8000
          3. Open http://localhost:8000/ in Chrome or Edge.
          4. Click Start Audio and check GLO > MIXER, MENU, EDIT and DRUM-X.
          5. Confirm occupied SAVE sections are orange and empty sections dark gray.
          6. Ensure selected projects have a white frame and orange values remain legible.

          This branch does not modify the public site or released v0.9 firmware.
          EOF
          printf '%s\n' "$GITHUB_SHA" > build/emu/SOURCE_COMMIT
          (cd build/emu && sha256sum felucca.wasm > WASM-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: jiant-live-drums-v09-orange-ui-emulator
          path: build/emu/
          if-no-files-found: error
          retention-days: 14
