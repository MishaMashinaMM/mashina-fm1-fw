# SPDX-License-Identifier: GPL-3.0-only
# Branch-only FM1 MIXER MIDI Activity device-test installer. Never deploy or update main.
name: MIXER MIDI Activity v0.9 device-test installer
on:
  push:
    branches: [mixer-midi-activity]
    paths:
      - 'firmware/**'
      - 'tools/**'
      - 'tests/**'
      - 'web/make_site.py'
      - '.github/workflows/mixer-midi-activity-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mixer-midi-activity-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install host dependencies
        run: pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
      - name: Run host regression tests
        timeout-minutes: 8
        run: |
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
          bash tests/run_live_drum_tests.sh
      - name: Cache pinned JieLi toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1.2.1
      - name: Prepare pinned JieLi SDK
        run: |
          retry() { for d in 0 5 15 30 60; do sleep "$d"; "$@" && return 0; done; return 1; }
          T="$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools"
          [ -e "$HOME/.jieli/toolchain/pi32v2/bin/clang" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            cd "$HOME/fw-AC79_AIoT_SDK"
            git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin /cpu/wl82/tools/cfg/eq_cfg_hw.bin
            retry git checkout d179b4484759423312073f5fbb232501aa491047
          fi
          test -s "$T/uboot.boot" && test -s "$T/cfg_tool.bin" && test -s "$T/cfg/eq_cfg_hw.bin"
      - name: Build v0.9 MIXER MIDI Activity firmware and check flash/RAM layout
        env:
          FELUCCA_NO_SEQUENCER: '1'
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
        run: |
          set -o pipefail
          python3 tools/build.py --release 0.9 2>&1 | tee firmware-build.log
          test -s build/felucca-0.9.fwsc
          test -s build/felucca.bin
      - name: Create standalone branch-specific installer
        run: |
          VERSION="v0.9-mixer-midi-activity-${GITHUB_SHA::7}-preview"
          OUT="build/mixer-midi-activity-device-test"
          python3 web/make_site.py build/felucca-0.9.fwsc "$VERSION" "$OUT"
          test -s "$OUT/webapp/installer/index.html"
          test -s "$OUT/firmware/felucca-$VERSION.fwsc"
          echo "$GITHUB_SHA" > "$OUT/firmware/SOURCE_COMMIT"
          (cd "$OUT/firmware" && sha256sum felucca-*.fwsc > SHA256SUMS)
          cp firmware-build.log "$OUT/firmware/BUILD-LOG.txt"
          cat > "$OUT/READ-ME-FIRST.txt" <<'EOF'
          JIANT LIVE DRUMS v0.9 / MIXER MIDI ACTIVITY - DEVICE TEST CANDIDATE
          ===========================================================
          Experimental firmware built from mixer-midi-activity branch, NOT main.
          Back up projects, presets and settings before flashing.
          This package is NOT yet tested on physical FM1.

          INSTALL ON WINDOWS:
          1. Extract the entire ZIP (do not open installer inside ZIP).
          2. Open PowerShell in the extracted folder.
          3. Run: py -m http.server 8000
          4. Open http://localhost:8000/webapp/installer/ in Chrome/Edge.
          5. Follow installer instructions; do not disconnect during flashing.

          DEVICE CHECKLIST:
          - Open GLO > MIX > MIXER, first page: ACT column shows six circles.
          - Idle: thin dark-gray ring with black center, including selected row.
          - Hold external MIDI note on channel 1: corresponding track circle
            turns solid orange (#FF9900); release note: returns to idle.
          - Hold notes on channels 1, 2, 3 together, release individually.
          - Check keyboard zones, overlapping assignments, sustain pedal.
          - Check selected (white) track row and muted/inactive tracks.
          - Test project switching and GLO + OCT- Panic Mode.
          - Confirm sound, macros, saved projects and presets remain normal.

          Version remains v0.9; preview package filename identifies source commit.
          Public installer and main branch remain unchanged.
          EOF
      - name: Upload standalone MIXER MIDI Activity device-test installer
        uses: actions/upload-artifact@v4
        with:
          name: jiant-live-drums-v09-mixer-midi-activity-device-installer
          path: build/mixer-midi-activity-device-test/
          if-no-files-found: error
          retention-days: 14
      - name: Upload raw firmware and build log
        uses: actions/upload-artifact@v4
        with:
          name: jiant-live-drums-v09-mixer-midi-activity-firmware
          path: |
            build/felucca-0.9.fwsc
            build/felucca.bin
            firmware-build.log
          if-no-files-found: error
          retention-days: 14
