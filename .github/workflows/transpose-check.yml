name: Transpose v0.6 verification

on:
  push:
    branches: [transpose]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate headers and assets
        run: |
          pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - name: Bounded MIXER UI regression
        timeout-minutes: 5
        run: |
          mkdir -p build/host/transpose
          cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -DUI_TEST_MIXER_ONLY=1 -Ibuild/gen -Ifirmware/src -o build/host/transpose/ui_test tests/ui_test.c -lm
          timeout 60s build/host/transpose/ui_test
      - name: GLO opens on MIXER and skips obsolete LIVE pages
        timeout-minutes: 5
        run: |
          cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -DUI_TEST_GLO_NAV_ONLY=1 -Ibuild/gen -Ifirmware/src -o build/host/transpose/glo_nav_test tests/ui_test.c -lm
          timeout 60s build/host/transpose/glo_nav_test
      - name: Transpose and MIDI ownership regression
        run: |
          cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -DTRANSPOSE_ONLY=1 -Ibuild/gen -Ifirmware/src -o build/host/transpose/midi_control tests/midi_control_test.c -lm
          build/host/transpose/midi_control
      - name: Live-only regression suite
        run: bash tests/run_live_drum_tests.sh
