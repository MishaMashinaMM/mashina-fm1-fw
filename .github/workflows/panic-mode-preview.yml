# SPDX-License-Identifier: GPL-3.0-only
# Branch-only Panic Mode validation. Never deploy Pages or release firmware.
name: Panic Mode emulator preview
on:
  push:
    branches: [panic-mode]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panic-mode-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate firmware assets
        run: |
          pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - name: Live Drums regression suite
        run: bash tests/run_live_drum_tests.sh
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - name: Build Panic Mode browser emulator
        env:
          FELUCCA_NO_SEQUENCER: '1'
          EMU_PREVIEW: '1'
          EMU_VERSION: 'v0.9-panic-mode'
        run: sh web/emu/build.sh
      - name: Verify WebAssembly boot and emulator
        run: |
          node web/emu/live-drums-wasm-test.mjs build/emu/felucca.wasm
          node web/emu/emu_test.mjs build/emu/felucca.wasm
      - name: Package browser preview
        run: |
          cat > build/emu/START-HERE.txt <<'EOF'
          Jiant Live Drums v0.9 - PANIC MODE experimental emulator
          Browser emulator only; do NOT flash.

          Unzip this artifact, run python -m http.server 8000 in the extracted
          directory, then open http://localhost:8000/ in Chrome or Edge.
          Hold GLO, tap OCT-, and verify PANIC MODE stays on screen until
          GLO is released. Check that the prior page returns afterwards.
          This preview does not change the released v0.9 site or installer.
          EOF
          printf '%s\n' "$GITHUB_SHA" > build/emu/SOURCE_COMMIT
          (cd build/emu && sha256sum felucca.wasm > WASM-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: jiant-live-drums-panic-mode-emulator
          path: build/emu/
          if-no-files-found: error
          retention-days: 14
