# SPDX-License-Identifier: GPL-3.0-only
# Compare two clean WASM builds with the same deterministic audio input.
name: Panic Mode audio comparison
on:
  push:
    branches: [panic-mode]
    paths:
      - 'firmware/src/**'
      - 'web/emu/compare-main-audio.mjs'
      - '.github/workflows/panic-mode-audio-compare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: panic
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - name: Build baseline main emulator
        working-directory: baseline
        run: |
          python3 -c "import sys; sys.path.insert(0,'tools'); import build; build.generate()"
          sh web/emu/build.sh
      - name: Build Panic Mode emulator
        working-directory: panic
        run: |
          python3 -c "import sys; sys.path.insert(0,'tools'); import build; build.generate()"
          sh web/emu/build.sh
      - name: Compare deterministic note-on, note-off and tails
        run: node panic/web/emu/compare-main-audio.mjs baseline/build/emu/felucca.wasm panic/build/emu/felucca.wasm
