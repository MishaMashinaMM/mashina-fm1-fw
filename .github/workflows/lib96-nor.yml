name: LIB96 isolated NOR geometry
on:
  push:
    branches: [presets-library-96]
  workflow_dispatch:
jobs:
  nor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Existing 32-slot and proposed 96-slot storage tests
        run: |
          gcc -std=gnu11 -O2 tests/preset_library_storage_test.c -o /tmp/lib32
          /tmp/lib32
          gcc -std=gnu11 -O2 -DMASHINA_LIB96_NOR_TEST tests/preset_library_storage_test.c -o /tmp/lib96
          /tmp/lib96
          gcc -std=gnu11 -O2 tests/lib96_reclaim_test.c -o /tmp/lib96-reclaim
          /tmp/lib96-reclaim

      - name: Prepare generated firmware assets
        run: |
          python3 -m pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1 Markdown==3.9
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - name: Run baseline and expanded sound and project-codec tests
        run: |
          for mode in baseline expanded; do
            FLAGS="-DMASHINA_HOST_TEST=1"
            if [ "$mode" = expanded ]; then FLAGS="$FLAGS -DMASHINA_LIB96_HOST_TEST=1"; fi
            cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 $FLAGS -Ibuild/gen -Ifirmware/src -o /tmp/libsound tests/presets_library_sound_test.c -lm
            /tmp/libsound
            cc -std=gnu11 -O2 $FLAGS tests/project_refs_test.c -o /tmp/librefs
            /tmp/librefs
          done
      - name: Web Library geometry and backup protocol regressions
        run: |
          node tests/presets_library_codec_test.mjs
          node tests/presets_library_sync_test.mjs
          node tests/projects_library_codec_test.mjs
          node tests/performance_backup_test.mjs
          node tests/full_device_backup_test.mjs
