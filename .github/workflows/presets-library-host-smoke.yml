name: Presets library quick host checks
on:
  push:
    branches: [presets-library]
    paths:
      - '.github/workflows/presets-library-host-smoke.yml'
      - 'web/**'
      - 'tests/**'
      - 'firmware/**'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: presets-library-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax before running regressions
        run: |
          for file in \
            web/presets-library-codec.mjs \
            web/presets-library-sync.mjs \
            web/projects-library-codec.mjs \
            web/projects-library-view.mjs \
            web/performance-backup.mjs \
            web/full-device-backup.mjs \
            web/factory-catalog-selection.mjs \
            tests/presets_library_codec_test.mjs \
            tests/presets_library_sync_test.mjs \
            tests/projects_library_codec_test.mjs \
            tests/performance_backup_test.mjs \
            tests/full_device_backup_test.mjs \
            tests/emu_library_flash_persistence_test.mjs \
            tests/glo_boot_page_test.mjs; do
            node --check "$file"
          done
      - name: Execute Web Library and backup regressions
        run: |
          node tests/presets_library_codec_test.mjs
          node tests/presets_library_sync_test.mjs
          node tests/projects_library_codec_test.mjs
          node tests/performance_backup_test.mjs
          node tests/full_device_backup_test.mjs
          node tests/flash_readiness_audit_test.mjs
          node tests/emu_library_flash_persistence_test.mjs
          node tests/glo_boot_page_test.mjs
          node web/test_backup.mjs
      - name: Guard protected 107-preset factory catalog and offline selection
        run: |
          node tools/export_factory_catalog.mjs --check
          node tests/factory_presets_catalog_test.mjs
          node tests/factory_catalog_selection_test.mjs
      - name: Generate exact 18 drum-kit factory record companions for offline selective import
        run: |
          python3 -m pip install --user Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1 Markdown==3.9
          python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
          mkdir -p build/host
          cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -DMASHINA_HOST_TEST=1 -Ibuild/gen -Ifirmware/src -o build/host/factory_drum_export tests/factory_drum_export.c -lm
          build/host/factory_drum_export > build/host/factory-drum-records.json
          node tests/factory_drum_records_test.mjs build/host/factory-drum-records.json
          node tests/factory_catalog_complete_test.mjs build/host/factory-drum-records.json
      - name: Validate complete Web Library preview imports and inline script syntax
        run: |
          mkdir -p build/presets-library-smoke
          cp web/presets-library-lab.html build/presets-library-smoke/index.html
          cp web/presets-library-codec.mjs web/presets-library-midi.mjs web/presets-library-sync.mjs build/presets-library-smoke/
          cp web/factory-presets-from-code.json web/factory-catalog-selection.mjs build/presets-library-smoke/
          cp build/host/factory-drum-records.json build/presets-library-smoke/
          cp web/fm1backup.js web/projects-library-codec.mjs web/projects-library-view.mjs build/presets-library-smoke/
          cp web/performance-backup.mjs web/full-device-backup.mjs build/presets-library-smoke/
          cp web/emulator-library-inspector.mjs web/emulator-snapshot-editor.mjs build/presets-library-smoke/
          cp web/flash-readiness.mjs build/presets-library-smoke/
          mkdir -p build/presets-library-smoke/emu
          cp web/emu/worklet.js web/emu/emulator-flash-backup.mjs build/presets-library-smoke/emu/
          python3 tools/check_library_preview.py build/presets-library-smoke
      - name: Run packaged Web Library in real headless Chrome
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
          npm install --no-save --ignore-scripts playwright-core@1.57.0
          node tests/emu_snapshot_browser_ui_smoke.mjs build/presets-library-smoke
      - name: Downloadable read-only Web Library snapshot inspector
        uses: actions/upload-artifact@v4
        with:
          name: mashina-web-library-snapshot-inspector-experimental
          path: build/presets-library-smoke/
          retention-days: 14
      - name: Check source-level flash boundaries and preset storage capacity
        run: |
          python3 tools/presets_library_flash_map_check.py
          python3 tools/presets_library_capacity.py
          python3 tools/presets_library_pack_experiment.py
      - name: Compile and execute pure host NOR and WebMIDI tests
        run: |
          mkdir -p build/host
          for suite in \
            project_refs_test \
            project_refs_store_test \
            preset_library_storage_test \
            preset_library_wire_test \
            flash_diagnostic_test; do
            cc -std=gnu11 -O2 -Wall -Wextra -o "build/host/$suite" "tests/$suite.c"
            "build/host/$suite"
          done
