name: LIB96 one-device installer
on:
  push:
    branches: [presets-library-96]
    paths: ['firmware/**', 'tools/**', 'web/**', 'tests/**', '.github/workflows/lib96-device-trial.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lib96-device-trial
  cancel-in-progress: true
jobs:
  compile:
    if: github.ref == 'refs/heads/presets-library-96'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install Pillow==12.3.0 numpy==2.3.5 fonttools==4.61.1 Markdown==3.9
      - uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK/cpu/wl82/tools
          key: jieli-ac79-v1.2.1
      - name: JieLi toolchain and SDK
        run: |
          retry() { for d in 0 5 15 30 60; do sleep "$d"; "$@" && return 0; done; return 1; }
          T=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          [ -e "$HOME/.jieli/toolchain" ] || retry sh tools/get_toolchain.sh "$HOME/.jieli"
          if [ ! -s "$T/uboot.boot" ] || [ ! -s "$T/cfg_tool.bin" ] || [ ! -s "$T/cfg/eq_cfg_hw.bin" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            retry git clone --filter=blob:none --no-checkout https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
            (cd "$HOME/fw-AC79_AIoT_SDK" && git sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin /cpu/wl82/tools/cfg/eq_cfg_hw.bin && retry git checkout d179b4484759423312073f5fbb232501aa491047)
          fi
      - name: Build authorized clean-install test package
        env:
          AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          FELUCCA_LIB96: "1"
          MASHINA_LIB96_TRIAL: "ONE-FM1-CLEAN-96"
          FELUCCA_LIB32: "1"
          FELUCCA_LIB32_WRITE: "1"
          FELUCCA_PROJECT_REFS: "1"
          FELUCCA_PROJECT_REFS_WRITE: "1"
          FELUCCA_INITIALIZED_UPDATE: "0"
          FELUCCA_PUBLIC_LAYOUT: "1"
          FELUCCA_PROJECT_REFS_FORMAT: "1"
          FELUCCA_CLEAN_INSTALL_LAYOUT: "1"
        run: |
          python3 tools/build.py --release 0.14-lib96test
          python3 tools/check_app_flash_headroom.py
          test -s build/felucca-0.14-lib96test.fwsc
      - name: Package matching offline installer and Web Library
        run: |
          mkdir -p build/host
          cc -O1 -w -DFELUCCA_NO_SEQUENCER=1 -DMASHINA_HOST_TEST=1 -Ibuild/gen -Ifirmware/src -o build/host/factory_drum_export tests/factory_drum_export.c -lm
          build/host/factory_drum_export > build/host/factory-drum-records.json
          node tests/factory_catalog_complete_test.mjs build/host/factory-drum-records.json
          node tests/factory_catalog_selection_test.mjs
          node tests/lib96_clean_trial_test.mjs
          python3 web/make_site.py build/felucca-0.14-lib96test.fwsc 0.14-lib96test build/lib96-test
          python3 - <<'PY'
          from pathlib import Path
          p=Path("build/lib96-test/webapp/installer/index.html")
          s=p.read_text()
          needle='  <p><button id="go" disabled data-t="install"></button></p>'
          assert needle in s
          s=s.replace(needle,'  <p style="border:2px solid #ff9900;padding:12px">EXPERIMENTAL LIB96 CLEAN INSTALL: any compatible FM1 firmware. Existing data will be erased during initialization; export anything you want to retain first (optional). After flashing, open <a href="../../web-library/initialize.html">Initialize storage</a>, then power-cycle.</p>'+needle)
          p.write_text(s)
          for q in Path("build/lib96-test/webapp").glob("installer-orange-*/index.html"):q.write_text(s)
          PY
          test -s build/lib96-test/web-library/initialize.html
          grep -Fq "69 owned" build/lib96-test/web-library/initialize.html
          grep -Fq "lib[1]===96" build/lib96-test/web-library/initialize.html
          test -s build/lib96-test/web-library/factory-drum-records.json
          printf '%s\n' "$GITHUB_SHA" > build/lib96-test/firmware/SOURCE_COMMIT
          cp docs/lib96-device-test.md build/lib96-test/READ-ME-FIRST.md
      - uses: actions/upload-artifact@v4
        with:
          name: mashina-lib96-one-device-test
          path: build/lib96-test/
          if-no-files-found: error
