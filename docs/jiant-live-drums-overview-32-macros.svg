<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="756" viewBox="0 0 1080 756" role="img" aria-labelledby="title description">
<title id="title">MASHINA v0.9 overview</title>
<desc id="description">An overview of MASHINA with BRASS and INDUSTRIAL melodic synthesis engines and two independent twelve-pad drum engines, SEQ MIDI mapping, PLAY performance options, and REC control of up to 32 MIDI CC macros per project. Eight voices are shared across all tracks. v0.8: independent note and velocity zones for six MIDI tracks. New in v0.9: dedicated six-row TUNING with per-track transpose ±36 semitones and FINE ±50 cents, separate from MIXER.</desc>
