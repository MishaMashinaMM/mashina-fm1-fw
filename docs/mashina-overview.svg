<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740" role="img" aria-labelledby="title description">
<title id="title">MASHINA v0.14 — FM1 Performance Firmware</title>
<desc id="description">MASHINA live-performance firmware for the M-VAVE FM1. Six independent MIDI-routed tracks, keyboard zones and tuning, 32 MIDI CC macros, ATMOS, BRASS and INDUSTRIAL synth engines, DRUM-X, DRUM-LAB, DRUM-AC and DRUM-IND, global equalizer, effects, and project recall. 32 USER + 32 replaceable LIBRARY sounds, eight projects with A–D sections, and Web Library with offline collections and full performance backups. Factory banks include philosopher-inspired preset names. An abstract orange mechanical cog identifies the project.</desc>
