<style>
:root{color-scheme:dark;--bg:#080808;--panel:#151515;--fg:#f4f4f4;--dim:#b6b6b6;--orange:#ff9900}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--orange);overflow-wrap:anywhere}
a:hover{text-decoration:none}
header{position:sticky;top:0;background:#111e;border-bottom:1px solid #444;backdrop-filter:blur(8px);padding:10px max(16px,calc((100vw - 1024px)/2));display:flex;align-items:center;gap:12px;justify-content:space-between;z-index:10}
.brand{font-size:17px;letter-spacing:.07em;font-weight:800;text-decoration:none;color:var(--orange)}
.brand span{display:block;font-size:9px;color:var(--dim);letter-spacing:.12em;line-height:1.2}
header nav{display:flex;gap:16px;font-size:13px}
main{max-width:1024px;margin:0 auto;padding:28px 20px 70px}
h1,h2,h3{line-height:1.25;scroll-margin-top:90px}
h1{font-size:clamp(29px,5vw,43px);font-weight:750;color:var(--orange)}
h2{margin-top:42px;font-size:25px;border-top:1px solid #434343;padding-top:22px}
h3{margin-top:24px;font-size:19px;color:var(--orange)}
p,li{max-width:86ch}
strong{color:#fff}
table{border-collapse:collapse;width:100%;margin:16px 0 24px;min-width:520px}
th,td{padding:9px 12px;border-bottom:1px solid #404040;text-align:left;vertical-align:top}
th{background:#2b2115;color:var(--orange);font-weight:650}
tr:nth-child(even) td{background:#111}
main>div{overflow-x:auto} article[data-manual-lang]:not([data-active]){display:none} article table{display:block;overflow-x:auto}
code{font:0.95em ui-monospace,monospace;color:var(--orange)}
blockquote{border-left:3px solid var(--orange);padding:6px 18px;margin-left:0;background:var(--panel)}
#toc{border:1px solid #494949;border-radius:12px;padding:12px 20px;margin:18px 0 24px;background:var(--panel)}
#toc ul{columns:2;padding-left:20px}
#toc li{break-inside:avoid;margin:5px 0}
footer{border-top:1px solid #444;max-width:1024px;padding:20px;margin:auto;color:var(--dim);font-size:13px}
@media(max-width:650px){#toc ul{columns:1}main{padding:20px 12px 50px}table{font-size:14px}header{padding:10px 12px}header nav{gap:8px}}
</style>
